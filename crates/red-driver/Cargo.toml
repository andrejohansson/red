# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "red-driver"
description = "RED database driver abstraction (DatabaseDriver) + the SQLite implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
red-core.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
rusqlite.workspace = true
tokio-postgres.workspace = true
mysql_async.workspace = true
futures-util.workspace = true
# ClickHouse driver — its HTTP interface (no heavy native-protocol client). reqwest
# (rustls) and serde_json are already in the tree via red-ai; uuid (already pulled
# by the ACP crate's subtree) gives each query a stable id for `KILL QUERY`.
reqwest.workspace = true
serde_json.workspace = true
uuid.workspace = true
# Redis driver — the KvDriver seam, see kv.rs/redis_kv.rs.
redis.workspace = true
url.workspace = true
# MongoDB driver — the DocDriver seam, see doc.rs/mongo.rs. Isolated to this
# crate; `bson` rides in as `mongodb::bson` (no separate BSON version).
mongodb.workspace = true
# BigQuery driver — its REST API over the same reqwest/rustls stack ClickHouse
# uses. `rsa` + `base64` sign the service-account JWT assertion (RS256); both are
# already in the tree, and neither is touched on the ADC path.
rsa.workspace = true
base64.workspace = true
# Only to install the process-wide crypto provider at startup (see
# `install_crypto_provider`); every TLS connection itself is made by the driver
# crates above, which share this same rustls.
rustls.workspace = true

[dev-dependencies]
# `net` is for the BigQuery driver's mock-server tests: they stand up a loopback
# TCP listener that replays canned REST responses, so the whole driver is exercised
# with no credentials and no billed queries.
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
