name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be kicked by hand from the Actions tab, so a green tree can be
  # re-established without an empty commit when a push event is missed.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default: nothing here publishes, and a job that cannot write
# cannot be turned into one by a compromised third-party action.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    # macOS: GPUI compiles Metal shaders, which needs a full Xcode toolchain.
    # GitHub's macOS runners point xcode-select at a real Xcode by default.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # The locale catalogs are generated from the source strings, so "committed
      # output matches the code" is the one check covering every domain. The
      # per-table drift tests below cannot see call-site `tr!` strings, which no
      # runtime test can enumerate.
      - name: i18n catalogs
        run: python3 scripts/i18n-extract.py --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Catches broken/dangling intra-doc links (see [workspace.lints.rustdoc]).
      # RUSTDOCFLAGS is the rustdoc twin of the global RUSTFLAGS=-D warnings above;
      # --no-deps keeps it to our crates.
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Test
        run: cargo test --workspace --locked

  drivers:
    name: network driver conformance (pg · mysql · clickhouse · redis · mongo)
    # The network drivers (Postgres/MySQL) live in `red-driver`/`red-service`,
    # which don't depend on GPUI — so they build + test on the cheap Linux runner,
    # where GitHub Actions service containers are available (they aren't on macOS).
    # This exercises the conformance battery (NULL handling, cancel, keyset merge,
    # capped-vs-full bytes) against real engines instead of skipping silently.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: red
          POSTGRES_DB: red_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: red
          MARIADB_DATABASE: red_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # The other three engines RED ships. Without them their batteries printed
      # `SKIP` and the job went green, so "conformance passes" said nothing about
      # ClickHouse, Redis or MongoDB - the three newest seams, and the two
      # (`KvDriver`, `DocDriver`) that no other job covers at all.
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RED_TEST_POSTGRES_URL: host=127.0.0.1 user=postgres password=red dbname=red_test
      RED_TEST_MYSQL_URL: mysql://root:red@127.0.0.1:3306/red_test
      RED_TEST_CLICKHOUSE_URL: clickhouse://default@127.0.0.1:8123/default
      RED_TEST_REDIS_URL: redis://127.0.0.1:6379
      RED_TEST_MONGO_URL: mongodb://127.0.0.1:27017
      # Turn a missing engine from a `SKIP` line into a failure. This job exists to
      # verify the drivers against real servers; a container that did not come up
      # must fail it rather than quietly reduce it to a compile check.
      RED_TEST_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2

      # `red-service` pulls in `red-config`, whose keyring backend on Linux is the
      # D-Bus secret service — so even this GPUI-free job needs the dbus headers.
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev

      # Only the engine-facing crates — no GPUI build on Linux. `--nocapture` so a
      # missing service surfaces the `SKIP …` line instead of a silent pass.
      - name: Test (red-driver · red-service, live engines)
        run: cargo test -p red-driver -p red-service --locked -- --nocapture

  deny:
    name: cargo-deny (supply chain)
    # No compile needed — cargo-deny reads the dependency graph — so the cheap
    # Linux runner is fine and runs in parallel with the macOS build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Supply-chain gate: security advisories, license policy, and the
      # git-source allow-list (see deny.toml).
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Cargo deny
        run: cargo deny check
